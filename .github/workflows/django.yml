"""
VulnScan Pro — Report Generator Module
=========================================
Combines findings from sqli_scanner, xss_scanner, and header_analyzer
into a single consolidated report — both HTML and PDF formats.

Usage (standalone test):
    python report_generator.py

Usage (from your main scan runner):
    from report_generator import generate_report

    all_findings = []
    all_findings += sqli_scanner.scan(url, param)
    all_findings += xss_scanner.test_reflected(url, param)
    all_findings += header_analyzer.analyze(url)

    generate_report(all_findings, target="http://localhost:5000", out_dir="reports")
"""

import os
import datetime
from html import escape

from reportlab.lib import colors
from reportlab.lib.pagesizes import A4
from reportlab.lib.units import mm
from reportlab.platypus import (
    SimpleDocTemplate, Table, TableStyle, Paragraph, Spacer
)
from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle

# ──────────────────────────────────────────────
# SEVERITY ORDERING + COLORS (shared by HTML + PDF)
# ──────────────────────────────────────────────

SEVERITY_ORDER  = {"Critical": 0, "High": 1, "Medium": 2, "Low": 3, "Info": 4}
SEVERITY_COLORS = {
    "Critical": "#f85149",
    "High":     "#f0883e",
    "Medium":   "#e3b341",
    "Low":      "#58a6ff",
    "Info":     "#8b949e",
}


def _sort_findings(findings):
    """Sort findings Critical -> Info, stable for equal severities."""
    return sorted(findings, key=lambda f: SEVERITY_ORDER.get(f.get("severity", "Info"), 5))


def _severity_counts(findings):
    counts = {k: 0 for k in SEVERITY_ORDER}
    for f in findings:
        sev = f.get("severity", "Info")
        counts[sev] = counts.get(sev, 0) + 1
    return counts


# ──────────────────────────────────────────────
# HTML REPORT
# ──────────────────────────────────────────────

HTML_TEMPLATE = """<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VulnScan Pro — Report</title>
<style>
  body {{ font-family: 'Segoe UI', Arial, sans-serif; background:#0d1117; color:#c9d1d9; margin:0; padding:2rem; }}
  h1 {{ color:#f85149; margin-bottom:0; }}
  .meta {{ color:#8b949e; margin-top:.25rem; margin-bottom:2rem; }}
  .summary {{ display:flex; gap:1rem; margin-bottom:2rem; flex-wrap:wrap; }}
  .card {{ flex:1; min-width:120px; background:#161b22; border:1px solid #30363d;
           border-radius:8px; padding:1rem; text-align:center; }}
  .card .count {{ font-size:2rem; font-weight:bold; }}
  .card .label {{ color:#8b949e; font-size:.85rem; text-transform:uppercase; }}
  table {{ width:100%; border-collapse:collapse; background:#161b22; border-radius:8px; overflow:hidden; }}
  th, td {{ padding:.75rem 1rem; text-align:left; border-bottom:1px solid #30363d; font-size:.9rem; }}
  th {{ background:#21262d; color:#8b949e; text-transform:uppercase; font-size:.75rem; }}
  tr:hover {{ background:#1c2128; }}
  .badge {{ padding:2px 10px; border-radius:12px; font-size:.75rem; font-weight:bold; color:#0d1117; }}
  .payload {{ font-family:monospace; color:#79c0ff; font-size:.8rem; word-break:break-all; }}
  .evidence {{ color:#8b949e; font-size:.82rem; }}
  footer {{ margin-top:2rem; color:#484f58; font-size:.8rem; }}
</style>
</head>
<body>
  <h1>VulnScan Pro — Vulnerability Report</h1>
  <div class="meta">Target: <b>{target}</b> &nbsp;|&nbsp; Generated: {timestamp} &nbsp;|&nbsp; Total findings: {total}</div>

  <div class="summary">
    {summary_cards}
  </div>

  <table>
    <tr><th>Severity</th><th>Type</th><th>Param</th><th>CVSS</th><th>Payload</th><th>Evidence</th></tr>
    {rows}
  </table>

  <footer>Generated by VulnScan Pro Report Generator &mdash; for authorized security testing only.</footer>
</body>
</html>"""

ROW_TEMPLATE = """<tr>
  <td><span class="badge" style="background:{color}">{severity}</span></td>
  <td>{type}</td>
  <td>{param}</td>
  <td>{cvss}</td>
  <td class="payload">{payload}</td>
  <td class="evidence">{evidence}</td>
</tr>"""

CARD_TEMPLATE = """<div class="card" style="border-color:{color}">
  <div class="count" style="color:{color}">{count}</div>
  <div class="label">{label}</div>
</div>"""


def generate_html_report(findings, target="N/A", out_path="reports/report.html"):
    """Render findings into a single self-contained HTML file."""
    findings = _sort_findings(findings)
    counts   = _severity_counts(findings)

    summary_cards = "".join(
        CARD_TEMPLATE.format(color=SEVERITY_COLORS[sev], count=counts[sev], label=sev)
        for sev in SEVERITY_ORDER
    )

    rows = "".join(
        ROW_TEMPLATE.format(
            color=SEVERITY_COLORS.get(f.get("severity", "Info"), "#8b949e"),
            severity=escape(str(f.get("severity", "Info"))),
            type=escape(str(f.get("type", "-"))),
            param=escape(str(f.get("param", "-"))),
            cvss=f.get("cvss", "-"),
            payload=escape(str(f.get("payload", "-"))[:160]),
            evidence=escape(str(f.get("evidence", "-"))),
        )
        for f in findings
    ) or "<tr><td colspan='6'>No findings recorded.</td></tr>"

    html = HTML_TEMPLATE.format(
        target=escape(target),
        timestamp=datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
        total=len(findings),
        summary_cards=summary_cards,
        rows=rows,
    )

    os.makedirs(os.path.dirname(out_path) or ".", exist_ok=True)
    with open(out_path, "w", encoding="utf-8") as fp:
        fp.write(html)

    print(f"[*] HTML report written to {out_path}")
    return out_path


# ──────────────────────────────────────────────
# PDF REPORT (reportlab)
# ──────────────────────────────────────────────

def generate_pdf_report(findings, target="N/A", out_path="reports/report.pdf"):
    """Render findings into a PDF using reportlab (no external HTML-to-PDF engine needed)."""
    findings = _sort_findings(findings)
    counts   = _severity_counts(findings)

    os.makedirs(os.path.dirname(out_path) or ".", exist_ok=True)

    doc = SimpleDocTemplate(
        out_path, pagesize=A4,
        leftMargin=18 * mm, rightMargin=18 * mm,
        topMargin=18 * mm, bottomMargin=18 * mm,
    )

    styles = getSampleStyleSheet()
    title_style = ParagraphStyle(
        "TitleRed", parent=styles["Title"], textColor=colors.HexColor("#c0392b")
    )
    meta_style = ParagraphStyle(
        "Meta", parent=styles["Normal"], textColor=colors.grey, fontSize=9
    )
    cell_style = ParagraphStyle(
        "Cell", parent=styles["Normal"], fontSize=8, leading=10
    )

    elements = [
        Paragraph("VulnScan Pro — Vulnerability Report", title_style),
        Spacer(1, 4),
        Paragraph(
            f"Target: {escape(target)} | Generated: "
            f"{datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S')} | "
            f"Total findings: {len(findings)}",
            meta_style,
        ),
        Spacer(1, 12),
    ]

    # Summary table (severity counts)
    summary_data = [["Severity", "Count"]] + [[sev, str(counts[sev])] for sev in SEVERITY_ORDER]
    summary_table = Table(summary_data, colWidths=[80 * mm, 30 * mm])
    summary_table.setStyle(TableStyle([
        ("BACKGROUND", (0, 0), (-1, 0), colors.HexColor("#21262d")),
        ("TEXTCOLOR",  (0, 0), (-1, 0), colors.white),
        ("FONTSIZE",   (0, 0), (-1, -1), 9),
        ("GRID",       (0, 0), (-1, -1), 0.5, colors.HexColor("#30363d")),
        ("ROWBACKGROUNDS", (0, 1), (-1, -1), [colors.white, colors.HexColor("#f6f8fa")]),
    ]))
    elements += [summary_table, Spacer(1, 16)]

    # Findings table
    header_row = ["Severity", "Type", "Param", "CVSS", "Payload", "Evidence"]
    table_data = [header_row]
    for f in findings:
        table_data.append([
            f.get("severity", "Info"),
            Paragraph(escape(str(f.get("type", "-"))), cell_style),
            Paragraph(escape(str(f.get("param", "-"))), cell_style),
            str(f.get("cvss", "-")),
            Paragraph(escape(str(f.get("payload", "-"))[:160]), cell_style),
            Paragraph(escape(str(f.get("evidence", "-"))), cell_style),
        ])
    if len(table_data) == 1:
        table_data.append(["-", "No findings recorded.", "-", "-", "-", "-"])

    findings_table = Table(
        table_data,
        colWidths=[18 * mm, 30 * mm, 22 * mm, 14 * mm, 45 * mm, 45 * mm],
        repeatRows=1,
    )

    style_cmds = [
        ("BACKGROUND", (0, 0), (-1, 0), colors.HexColor("#21262d")),
        ("TEXTCOLOR",  (0, 0), (-1, 0), colors.white),
        ("FONTSIZE",   (0, 0), (-1, -1), 8),
        ("GRID",       (0, 0), (-1, -1), 0.5, colors.HexColor("#30363d")),
        ("VALIGN",     (0, 0), (-1, -1), "TOP"),
    ]
    # Colour the severity cell per row based on severity value
    for i, row in enumerate(table_data[1:], start=1):
        sev = row[0]
        hexcol = SEVERITY_COLORS.get(sev, "#8b949e")
        style_cmds.append(("TEXTCOLOR", (0, i), (0, i), colors.HexColor(hexcol)))
        style_cmds.append(("FONTNAME", (0, i), (0, i), "Helvetica-Bold"))

    findings_table.setStyle(TableStyle(style_cmds))
    elements.append(findings_table)

    doc.build(elements)
    print(f"[*] PDF report written to {out_path}")
    return out_path


# ──────────────────────────────────────────────
# COMBINED ENTRY POINT
# ──────────────────────────────────────────────

def generate_report(findings, target="N/A", out_dir="reports", formats=("html", "pdf")):
    """
    Generate report(s) in requested formats.
    Returns dict of {format: filepath}.
    """
    out_paths = {}
    if "html" in formats:
        out_paths["html"] = generate_html_report(
            findings, target, os.path.join(out_dir, "report.html")
        )
    if "pdf" in formats:
        out_paths["pdf"] = generate_pdf_report(
            findings, target, os.path.join(out_dir, "report.pdf")
        )
    return out_paths


# ──────────────────────────────────────────────
# STANDALONE TEST
# ──────────────────────────────────────────────

if __name__ == "__main__":
    sample_findings = [
        {"type": "SQLi - Error Based", "param": "username", "payload": "' OR 1=1--",
